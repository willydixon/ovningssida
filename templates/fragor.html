<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<title>{{questions_page_title}}</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="{{app_name}}">
</head>
<body>
<div class="testband">{{test_band_pages}}</div>
<main class="page">
<a class="back" href="index.html">{{back_to_practice}}</a>
<h1>{{questions_title}}</h1>
<p class="lead">{{questions_lead}}</p>
<!-- Netlify Forms tar emot svaren. Sidan har inget skript. -->
<form class="form" name="fragor" method="POST" action="/fragor-tack.html" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="fragor">
  <p class="honeypot" hidden><label>{{honeypot_label}} <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
  <label class="field">
    <span>{{questions_role_label}}</span>
    <select name="roll">
      <option value="skadespelare">{{questions_role_actor}}</option>
      <option value="larare">{{questions_role_teacher}}</option>
      <option value="annat">{{questions_role_other}}</option>
    </select>
  </label>
  <label class="field"><span>{{questions_q1}}</span><textarea name="fraga1" rows="3"></textarea></label>
  <label class="field"><span>{{questions_q2}}</span><textarea name="fraga2" rows="3"></textarea></label>
  <label class="field"><span>{{questions_q3}}</span><textarea name="fraga3" rows="3"></textarea></label>
  <label class="field"><span>{{questions_q4}}</span><textarea name="fraga4" rows="3"></textarea></label>
  <label class="field"><span>{{questions_q5}}</span><textarea name="fraga5" rows="3"></textarea></label>
  <label class="field"><span>{{questions_q6}}</span><textarea name="fraga6" rows="3"></textarea></label>
  <label class="check">
    <input type="checkbox" name="kopolank" value="ja">
    <span>{{questions_q7_label}}</span>
  </label>
  <label class="field">
    <span>{{questions_email_label}}</span>
    <input type="email" name="epost" autocomplete="email">
  </label>
  <label class="check">
    <input type="checkbox" name="vuxen" value="ja" required>
    <span>{{age_checkbox}}</span>
  </label>
  <label class="check">
    <input type="checkbox" name="samtycke" value="ja" required>
    <span>{{questions_consent_label}}</span>
  </label>
  <p class="small"><a href="integritet.html">{{privacy_link}}</a></p>
  <button type="submit" class="primary">{{questions_button}}</button>
</form>
</main>
<footer>
  <nav aria-label="{{footer_label}}">
    <a href="pris.html">{{footer_price}}</a>
    <a href="anmalan.html">{{footer_signup}}</a>
    <a href="om.html">{{footer_about}}</a>
    <a href="ai.html">{{footer_ai}}</a>
    <a href="integritet.html">{{footer_privacy}}</a>
    <a href="villkor.html">{{footer_terms}}</a>
    <a href="kontakt.html">{{footer_contact}}</a>
  </nav>
</footer>
</body>
</html>
