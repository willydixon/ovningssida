<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<title>{{signup_page_title}}</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="{{app_name}}">
<script type="module" src="anmalan.js"></script>
</head>
<body>
<div class="testband">{{test_band_pages}}</div>
<main class="page">
<a class="back" href="index.html">{{back_to_practice}}</a>
<h1>{{signup_title}}</h1>
<p class="lead">{{signup_lead}}</p>
<!-- Netlify Forms tar emot anmälan. Inget skript skickar något: formuläret skickas som en vanlig sida. -->
<form class="form" name="anmalan" method="POST" action="/tack.html" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="anmalan">
  <input type="hidden" name="fran" id="fran" value="">
  <p class="honeypot" hidden><label>{{honeypot_label}} <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
  <label class="field">
    <span>{{signup_email_label}}</span>
    <input type="email" name="epost" autocomplete="email" required>
  </label>
  <label class="field">
    <span>{{signup_source_label}}</span>
    <select name="kalla">
      <option value="">{{signup_source_choose}}</option>
      <option value="tiktok">{{signup_source_tiktok}}</option>
      <option value="instagram">{{signup_source_instagram}}</option>
      <option value="google">{{signup_source_google}}</option>
      <option value="van">{{signup_source_friend}}</option>
      <option value="annat">{{signup_source_other}}</option>
    </select>
  </label>
  <label class="check">
    <input type="checkbox" name="android" value="ja">
    <span>{{signup_android_label}}</span>
  </label>
  <label class="check">
    <input type="checkbox" name="vuxen" value="ja" required>
    <span>{{age_checkbox}}</span>
  </label>
  <label class="check">
    <input type="checkbox" name="samtycke" value="ja" required>
    <span>{{signup_consent_label}}</span>
  </label>
  <p class="small"><a href="integritet.html">{{privacy_link}}</a></p>
  <button type="submit" class="primary">{{signup_button}}</button>
</form>
</main>
<footer>
  <nav aria-label="{{footer_label}}">
    <a href="pris.html">{{footer_price}}</a>
    <a href="anmalan.html">{{footer_signup}}</a>
    <a href="om.html">{{footer_about}}</a>
    <a href="ai.html">{{footer_ai}}</a>
    <a href="integritet.html">{{footer_privacy}}</a>
    <a href="villkor.html">{{footer_terms}}</a>
    <a href="kontakt.html">{{footer_contact}}</a>
  </nav>
</footer>
</body>
</html>
