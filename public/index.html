<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Under uppbyggnad</title>
<style>
  :root { color-scheme: light dark; --bg: #faf9f7; --ink: #1f1e1d; --quiet: #5e5d59; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1e1d; --ink: #f5f4ef; --quiet: #b8b5ab; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; padding: 2rem 1rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0; color: var(--quiet); line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Under uppbyggnad</h1>
  <p>Här byggs en övningssida för skådespelare. Den är inte öppen än.</p>
</main>
</body>
</html>
